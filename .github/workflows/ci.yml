name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json (9.12.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Production build
        # Same command the Dockerfile runs; an empty API base keeps the bundle same-origin.
        run: pnpm build:production
        env:
          EXPO_PUBLIC_API_BASE_URL: ""
